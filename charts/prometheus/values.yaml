image:
  repository: prom/prometheus
  tag: v2.55.1
  pullPolicy: IfNotPresent

# Use host network for edge deployments (easier service discovery)
hostNetwork: true

# Service configuration (useful when not using hostNetwork)
service:
  type: ClusterIP
  port: 9090
  nodePort: 30090

# Ingress configuration
ingress:
  enabled: true
  className: "traefik"
  annotations: {}
    # Use Traefik's wildcard certificate
    # To use cert-manager instead, add:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: prometheus-default.baezw.com
      paths:
        - path: /
          pathType: Prefix
  # Leave tls empty to use Traefik's default certificate
  tls: []

# Persistence for metrics data
persistence:
  enabled: true
  type: hostPath  # hostPath (edge) or pvc (cluster)
  hostPath: /var/lib/prometheus
  size: 20Gi
  storageClass: ""

# Prometheus configuration
config:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
    external_labels:
      cluster: 'default'
  
  # Scrape configs
  scrape_configs:
    # Prometheus self-monitoring
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']
    
    # Kubernetes API server
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
        - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https
    
    # Kubernetes nodes
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
        - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
    
    # Kubernetes pods
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name

# Data retention
retention:
  time: 15d
  size: 0  # 0 means no size limit

# RBAC for service discovery
rbac:
  create: true

# Security context (when using hostPath, needs root or matching host permissions)
securityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

resources: {}
  # limits:
  #   cpu: 1000m
  #   memory: 2Gi
  # requests:
  #   cpu: 500m
  #   memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}
