image:
  repository: ghcr.io/headlamp-k8s/headlamp
  tag: v0.25.1
  pullPolicy: IfNotPresent

replicaCount: 1

# Use host network when mounting host kubeconfig (required for localhost API access)
hostNetwork: true

# Service configuration
service:
  type: NodePort
  port: 80
  targetPort: 4466

# Ingress configuration
ingress:
  enabled: false
  className: "traefik"
  annotations: {}
    # Use self-signed certificate (generated by Helm)
    # To use cert-manager instead, add:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: headlamp.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: headlamp-tls
      hosts:
        - headlamp.local

# NodePort configuration
nodePort:
  enabled: true
  port: 30446

# Environment variables
env:
  # Base URL path for reverse proxy (e.g., /headlamp)
  baseURL: ""
  # Additional environment variables
  extra: []
  # - name: HEADLAMP_CONFIG_OIDC_CLIENT_ID
  #   value: "your-client-id"

# Host kubeconfig mount (use host cluster context)
hostKubeconfig:
  enabled: true
  # Path to kubeconfig on host node
  # k3s: /etc/rancher/k3s/k3s.yaml
  # k8s: /etc/kubernetes/admin.conf or /root/.kube/config
  path: /etc/rancher/k3s/k3s.yaml

# RBAC configuration
rbac:
  # Create RBAC resources (ServiceAccount, ClusterRole, ClusterRoleBinding)
  create: true
  # Name of the service account to use (leave empty to auto-generate)
  serviceAccountName: ""
  # ClusterRole rules - full cluster access by default
  clusterRole:
    rules:
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["*"]

# Plugin support
plugins:
  enabled: false
  # List of plugin URLs to install
  urls: []
  # - https://github.com/headlamp-k8s/headlamp-plugins/releases/download/v1.0.0/plugin.tar.gz

# Persistence for plugins and config
persistence:
  enabled: false
  type: pvc
  size: 1Gi
  storageClass: ""
  mountPath: /headlamp-plugins

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
