apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "website-monitor.fullname" . }}
  labels:
    {{- include "website-monitor.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "website-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "website-monitor.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Always
      containers:
      - name: monitor
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/sh", "/scripts/check-websites.sh"]
        volumeMounts:
        - name: script
          mountPath: /scripts
        env:
        {{- range .Values.env.extra }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: script
        configMap:
          name: {{ include "website-monitor.fullname" . }}-script
          defaultMode: 0755
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
