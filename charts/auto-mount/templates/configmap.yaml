    @app.route("/automount/mount/<drive>", methods=["POST"])
    def mount(drive):
        """Mount hotswap or optical drive"""
        path = HOTSWAP if drive == "hotswap" else OPTICAL
        
        if drive == "hotswap":
            # Find and mount all partitions from hotswap port
            hotswap_port = "{{ .Values.hotswapDevice }}.0"
            mount_results = []
            
            # Clean up old partition directories
            try:
                result = subprocess.run(f"ls {path}/partition* 2>/dev/null", shell=True, capture_output=True, text=True)
                if result.returncode == 0:
                    for old_dir in result.stdout.strip().split('\n'):
                        if old_dir:
                            # Check if mounted
                            check = subprocess.run(f"mountpoint -q {old_dir}", shell=True)
                            if check.returncode != 0:
                                subprocess.run(f"rmdir {old_dir} 2>/dev/null", shell=True)
            except:
                pass
            
            # Find and mount all partitions
            result = subprocess.run(f"ls {hotswap_port}-part* 2>/dev/null", shell=True, capture_output=True, text=True)
            if result.returncode == 0:
                partitions = result.stdout.strip().split('\n')
                for partition in partitions:
                    if partition and os.path.exists(partition):
                        # Extract partition number
                        part_num = partition.split('-part')[-1]
                        mount_point = f"{path}/partition{part_num}"
                        
                        # Create mount point
                        os.makedirs(mount_point, exist_ok=True)
                        
                        # Mount if not already mounted
                        check = subprocess.run(f"mountpoint -q {mount_point}", shell=True)
                        if check.returncode != 0:
                            result = run_cmd(f"mount {partition} {mount_point}")
                            mount_results.append(f"partition{part_num}: {result.get('output', result.get('error', 'unknown'))}")
                        else:
                            mount_results.append(f"partition{part_num}: already mounted")
                
                if mount_results:
                    # Enable share
                    run_cmd("sed -i '/\\[hotswap\\]/,/^$/{{ `{{` }}s/available = no/available = yes/{{ `}}` }}' /etc/samba/smb.conf && smbcontrol all reload-config")
                    return jsonify({"ok": True, "output": "\n".join(mount_results)})
                else:
                    return jsonify({"ok": False, "error": "No partitions found"})
            else:
                return jsonify({"ok": False, "error": "No hotswap device detected"})
        
        elif drive == "optical":
            # Set mount in progress flag
            global _mount_in_progress
            _mount_in_progress["active"] = True
            _mount_in_progress["type"] = "Video DVD"  # Will be updated by detection
            
            # Try to mount optical disc
            result = run_cmd(f"mount -t udf,iso9660 -o ro /dev/sr0 {path}")
            if result["ok"]:
                # Enable share
                run_cmd("sed -i '/\\[optical\\]/,/^$/{{ `{{` }}s/available = no/available = yes/{{ `}}` }}' /etc/samba/smb.conf && smbcontrol all reload-config")
            
            # Clear mount in progress after 3 seconds to allow mount to complete
            import threading
            threading.Timer(3.0, lambda: _mount_in_progress.update({"active": False, "type": ""})).start()
            
            return jsonify(result)
        
        return jsonify({"ok": False, "error": "Invalid drive"})
    
    @app.route("/automount/unmount/<drive>", methods=["POST"])
    def unmount(drive):
        path = HOTSWAP if drive == "hotswap" else OPTICAL
        
        # Check if path itself is mounted and unmount it
        result = subprocess.run(f"mountpoint -q {path}", shell=True)
        if result.returncode == 0:
            return jsonify(run_cmd(f"umount {path}"))
        
        # Find and unmount all mounted subdirectories
        unmount_results = []
        try:
            subdirs = [d for d in os.listdir(path) if os.path.isdir(os.path.join(path, d))]
            for subdir in subdirs:
                subpath = os.path.join(path, subdir)
                result = subprocess.run(f"mountpoint -q {subpath}", shell=True)
                if result.returncode == 0:
                    result = run_cmd(f"umount {subpath}")
                    unmount_results.append(f"{subdir}: {result.get('output', result.get('error', 'unknown'))}")
        except Exception as e:
            return jsonify({"ok": False, "error": str(e)})
        
        if unmount_results:
            # Disable share
            share_name = "hotswap" if drive == "hotswap" else "optical"
            run_cmd(f"sed -i '/\\[{share_name}\\]/,/^$/{{ `{{` }}s/available = yes/available = no/{{ `}}` }}' /etc/samba/smb.conf && smbcontrol all reload-config")
            return jsonify({"ok": True, "output": "\n".join(unmount_results)})
        else:
            return jsonify({"ok": False, "error": "No mounted filesystems found"})
    
    @app.route("/automount/rip/status")
    def rip_status():
        """Get status of any active rip operations (Audio CDs and DVD ISOs)"""
        rip_items = []
        try:
            if os.path.exists("/raid5/cd-rips"):
                for item in os.listdir("/raid5/cd-rips"):
                    item_path = os.path.join("/raid5/cd-rips", item)
                    
                    # Check for audio CD directories
                    if os.path.isdir(item_path) and (item.startswith("AudioCD_") or " - " in item):
                        status_file = os.path.join(item_path, "status.txt")
                        log_file = os.path.join(item_path, "rip.log")
                        
                        status = "UNKNOWN"
                        if os.path.exists(status_file):
                            with open(status_file, 'r') as f:
                                status = f.read().strip()
                        
                        log_tail = ""
                        if os.path.exists(log_file):
                            result = subprocess.run(f"tail -100 \"{log_file}\"", shell=True, capture_output=True, text=True)
                            log_tail = result.stdout
                        
                        rip_items.append({
                            "dir": item,
                            "status": status,
                            "log": log_tail
                        })
                    
                    # Check for DVD ISO, MKV, and M4V files
                    elif (item.endswith(".iso") or item.endswith(".mkv") or item.endswith(".m4v")) and item.startswith("DVD_"):
                        file_path = item_path
                        log_path = item_path.replace(".iso", ".log").replace(".mkv", ".log").replace(".m4v", ".log")
                        if item.endswith(".iso"):
                            file_type = "ISO"
                        elif item.endswith(".m4v"):
                            file_type = "M4V"
                        else:
                            file_type = "MKV"
                        
                        # Check if process is still running (dd for ISO, HandBrakeCLI for MKV/M4V)
                        if file_type == "ISO":
                            ps_cmd = f"ps aux | grep 'dd if=/dev/sr0 of={file_path}' | grep -v grep"
                        else:
                            ps_cmd = f"ps aux | grep 'HandBrakeCLI.*{item}' | grep -v grep"
                        
                        ps_result = subprocess.run(ps_cmd, shell=True, capture_output=True, text=True)
                        is_running = len(ps_result.stdout.strip()) > 0
                        
                        # Get current file size
                        if os.path.exists(file_path):
                            current_size = os.path.getsize(file_path)
                            current_mb = current_size // (1024 * 1024)
                            
                            if file_type == "ISO":
                                # For ISO, compare to disc size (use cached state to avoid disc queries)
                                global _last_disc_state
                                expected_mb = _last_disc_state.get("size_mb", 0) if _last_disc_state.get("present") else 0
                                
                                if expected_mb > 0:
                                    percent = int((current_mb / expected_mb) * 100)
                                    status = f"IN_PROGRESS - {percent}% ({current_mb} MB / {expected_mb} MB)"
                                else:
                                    status = f"IN_PROGRESS - {current_mb} MB written"
                                
                                if not is_running:
                                    if expected_mb > 0 and current_mb >= expected_mb * 0.95:
                                        status = "COMPLETE"
                                    else:
                                        status = f"INCOMPLETE - stopped at {current_mb} MB"
                            else:
                                # For MKV/M4V, we can't easily predict size, just show current
                                if is_running:
                                    status = f"IN_PROGRESS - {current_mb} MB transcoded"
                                else:
                                    status = f"COMPLETE - {current_mb} MB"
                        else:
                            status = "STARTING" if is_running else "FAILED - no file created"
                        
                        # Read log tail
                        log_tail = ""
                        if os.path.exists(log_path):
                            result = subprocess.run(f"tail -20 \"{log_path}\"", shell=True, capture_output=True, text=True)
                            log_tail = result.stdout
                        
                        rip_items.append({
                            "dir": item,
                            "status": status,
                            "log": log_tail if log_tail else f"DVD {file_type} rip in progress..."
                        })
                    
                    # Check for standalone .log files (rip in progress, output file not created yet)
                    elif item.endswith(".log") and item.startswith("DVD_"):
                        log_path = item_path
                        # Check if corresponding .mkv, .iso, or .m4v exists
                        mkv_path = log_path.replace(".log", ".mkv")
                        iso_path = log_path.replace(".log", ".iso")
                        m4v_path = log_path.replace(".log", ".m4v")
                        if not os.path.exists(mkv_path) and not os.path.exists(iso_path) and not os.path.exists(m4v_path):
                            # Check if process is actually running
                            ps_result = subprocess.run("ps aux | grep -E 'HandBrakeCLI|dd if=/dev/sr0' | grep -v grep", shell=True, capture_output=True, text=True)
                            if len(ps_result.stdout.strip()) > 0:
                                # Log file exists but no output file AND process is running - rip is starting/scanning
                                log_tail = ""
                                if os.path.exists(log_path):
                                    result = subprocess.run(f"tail -20 \"{log_path}\"", shell=True, capture_output=True, text=True)
                                    log_tail = result.stdout
                                
                                rip_items.append({
                                    "dir": item.replace(".log", ""),
                                    "status": "IN_PROGRESS - scanning disc",
                                    "log": log_tail if log_tail else "Starting..."
                                })
        except Exception as e:
            return jsonify({"ok": False, "error": str(e)})
        
        return jsonify({"ok": True, "rips": rip_items})
    
    @app.route("/automount/eject", methods=["POST"])
    def eject_disc():
        import time
        import threading
        global _last_disc_state, _eject_in_progress
        
        # Set eject in progress flag to pause disc detection FIRST
        _eject_in_progress = True
        
        # Wait a moment for any in-progress detection to finish
        time.sleep(1)
        
        # Force unmount everything under optical mount point
        try:
            # First try to unmount any subdirectories
            subprocess.run(f"umount {OPTICAL}/* 2>/dev/null || true", shell=True, timeout=5)
            # Then unmount the main mount point (with force)
            subprocess.run(f"umount -f {OPTICAL} 2>/dev/null || true", shell=True, timeout=5)
            # Also force unmount /dev/sr0 if mounted elsewhere
            subprocess.run("umount -f /dev/sr0 2>/dev/null || true", shell=True, timeout=5)
        except:
            pass
        
        # Disable auto-close mechanism
        subprocess.run("eject -i off /dev/sr0 2>/dev/null", shell=True, capture_output=True)
        
        # Try eject with retries (up to 3 attempts with 2s between)
        eject_success = False
        for attempt in range(3):
            try:
                result = subprocess.run("eject /dev/sr0", shell=True, capture_output=True, text=True, timeout=5)
                if result.returncode == 0:
                    eject_success = True
                    break
                time.sleep(2)
            except subprocess.TimeoutExpired:
                time.sleep(2)
        
        # Clear cached disc state immediately after eject
        _last_disc_state = {"present": False, "type": "No disc", "info": ""}
        
        # Keep eject flag active until user clicks "Close & Detect"
        # No background thread - user controls when to resume detection
        
        if eject_success:
            return jsonify({"ok": True, "output": "Tray ejected - click 'Close & Detect' after closing tray"})
        else:
            return jsonify({"ok": False, "error": "Eject failed after 3 attempts"})
    
    @app.route("/automount/close-detect", methods=["POST"])
    def close_and_detect():
        """Clear eject flag and trigger immediate disc detection"""
        global _eject_in_progress
        _eject_in_progress = False
        
        # Give the tray a moment to settle
        time.sleep(1)
        
        # Trigger immediate detection
        disc_info = detect_optical_disc()
        
        return jsonify({"ok": True, "disc": disc_info})
    
    @app.route("/automount/rip", methods=["POST"])
    def rip_disc():
        """Rip audio CD or video DVD"""
        import sys
        
        # Check if a rip is already in progress
        try:
            if os.path.exists("/raid5/cd-rips"):
                for item in os.listdir("/raid5/cd-rips"):
                    item_path = os.path.join("/raid5/cd-rips", item)
                    
                    # Check for audio CD rips
                    if os.path.isdir(item_path) and (item.startswith("AudioCD_") or " - " in item):
                        status_file = os.path.join(item_path, "status.txt")
                        if os.path.exists(status_file):
                            with open(status_file, 'r') as f:
                                status = f.read().strip()
                                if status == "IN_PROGRESS":
                                    return jsonify({"ok": False, "error": f"A rip is already in progress: {item}\\nPlease wait for it to complete or cancel it first."})
                    
                    # Check for DVD rips (ISO/M4V)
                    elif (item.endswith(".iso") or item.endswith(".m4v")) and item.startswith("DVD_"):
                        file_path = item_path
                        file_type = "ISO" if item.endswith(".iso") else "M4V"
                        
                        # Check if process is still running
                        if file_type == "ISO":
                            ps_cmd = f"ps aux | grep 'dd if=/dev/sr0 of={file_path}' | grep -v grep"
                        else:
                            ps_cmd = f"ps aux | grep 'HandBrakeCLI.*{item}' | grep -v grep"
                        
                        ps_result = subprocess.run(ps_cmd, shell=True, capture_output=True, text=True)
                        if len(ps_result.stdout.strip()) > 0:
                            return jsonify({"ok": False, "error": f"A rip is already in progress: {item}\\nPlease wait for it to complete or cancel it first."})
                    
                    # Check for standalone log files (rip starting)
                    elif item.endswith(".log") and item.startswith("DVD_"):
                        log_path = item_path
                        mkv_path = log_path.replace(".log", ".mkv")
                        iso_path = log_path.replace(".log", ".iso")
                        m4v_path = log_path.replace(".log", ".m4v")
                        if not os.path.exists(mkv_path) and not os.path.exists(iso_path) and not os.path.exists(m4v_path):
                            ps_result = subprocess.run("ps aux | grep -E 'HandBrakeCLI|dd if=/dev/sr0' | grep -v grep", shell=True, capture_output=True, text=True)
                            if len(ps_result.stdout.strip()) > 0:
                                return jsonify({"ok": False, "error": f"A rip is already starting: {item}\\nPlease wait for it to complete or cancel it first."})
        except Exception as e:
            print(f"[RIP] Error checking for active rips: {str(e)}", file=sys.stderr, flush=True)
        
        # Detect disc type
        disc_info = detect_optical_disc()
        if not disc_info["present"]:
            return jsonify({"ok": False, "error": "No disc detected"})
        
        disc_type = disc_info["type"]
        print(f"[RIP] Starting rip for {disc_type}", file=sys.stderr, flush=True)
        
        if disc_type == "Audio CD":
            # Get MusicBrainz disc ID
            try:
                import discid
                disc = discid.read("/dev/sr0")
                mb_disc_id = disc.id
                num_tracks = len(disc.tracks)
                print(f"[RIP] MusicBrainz Disc ID: {mb_disc_id}, Tracks: {num_tracks}", file=sys.stderr, flush=True)
            except Exception as e:
                print(f"[RIP] Failed to read disc ID: {str(e)}", file=sys.stderr, flush=True)
                return jsonify({"ok": False, "error": f"Failed to read disc: {str(e)}"})
                
            # Lookup metadata from MusicBrainz
            print(f"[RIP] Looking up metadata for disc ID: {mb_disc_id}", file=sys.stderr, flush=True)
            import musicbrainzngs
            musicbrainzngs.set_useragent("auto-mount-cd-ripper", "1.0", "https://github.com/billy27607/my-helm-charts")
            
            metadata = {"found": False}
            try:
                # Try direct disc ID lookup first
                result = musicbrainzngs.get_releases_by_discid(mb_disc_id, includes=["artists", "recordings", "artist-credits"])
                if result.get("disc") and result["disc"].get("release-list"):
                    release = result["disc"]["release-list"][0]
                    artist = release["artist-credit-phrase"] if "artist-credit-phrase" in release else "Unknown Artist"
                    album = release["title"] if "title" in release else "Unknown Album"
                    year = release["date"][:4] if "date" in release and release["date"] else ""
                    
                    tracks = []
                    if "medium-list" in release:
                        for medium in release["medium-list"]:
                            if "disc-list" in medium:
                                for disc in medium["disc-list"]:
                                    if disc.get("id") == mb_disc_id and "track-list" in medium:
                                        for track in medium["track-list"]:
                                            track_num = track.get("position", "")
                                            track_title = track.get("recording", {}).get("title", f"Track {track_num}")
                                            tracks.append({"num": track_num, "title": track_title})
                                        break
                    
                    metadata = {
                        "found": True,
                        "artist": artist,
                        "album": album,
                        "year": year,
                        "tracks": tracks
                    }
                    print(f"[RIP] Found: {artist} - {album} ({year})", file=sys.stderr, flush=True)
            except Exception as e:
                print(f"[RIP] Metadata lookup failed: {str(e)}", file=sys.stderr, flush=True)
            
            # Create output directory with metadata if available
            if metadata["found"]:
                safe_artist = metadata["artist"].replace("/", "-").replace("\\", "-")[:50]
                safe_album = metadata["album"].replace("/", "-").replace("\\", "-")[:50]
                year_str = f" ({metadata['year']})" if metadata["year"] else ""
                output_dir = f"/raid5/cd-rips/{safe_artist} - {safe_album}{year_str}"
            else:
                timestamp = subprocess.run("date +%Y%m%d_%H%M%S", shell=True, capture_output=True, text=True).stdout.strip()
                output_dir = f"/raid5/cd-rips/AudioCD_{timestamp}"
            
            # Create output directory
            os.makedirs(output_dir, exist_ok=True)
            print("[RIP] Created output directory: " + output_dir, file=sys.stderr, flush=True)
            
            # Save metadata to JSON file
            if metadata["found"]:
                import json
                with open(output_dir + "/metadata.json", 'w') as f:
                    json.dump(metadata, f, indent=2)
            
            # Create rip script
            script_path = output_dir + "/rip.sh"
            with open(script_path, 'w') as f:
                f.write("#!/bin/sh\n")
                f.write("# Don't use set -e - we want to continue on errors and log them\n")
                f.write(f"cd \"{output_dir}\"\n")
                f.write("echo 'IN_PROGRESS' > status.txt\n")
                f.write("echo '[RIP] Starting cdparanoia rip at 40x speed...' | tee -a rip.log\n")
                f.write("if cdparanoia -B -S 40 -d /dev/sr0 2>&1 | tee -a rip.log; then\n")
                f.write("  echo '[RIP] cdparanoia completed successfully' | tee -a rip.log\n")
                f.write("else\n")
                f.write("  echo '[ERROR] cdparanoia failed with exit code $?' | tee -a rip.log\n")
                f.write("fi\n")
                f.write("echo '[RIP] Converting WAV to ALAC...' | tee -a rip.log\n")
                f.write("FAILED_TRACKS=''\n")
                f.write("# Ensure output is unbuffered\n")
                f.write("export PYTHONUNBUFFERED=1\n")
                f.write("stdbuf -oL -eL true 2>/dev/null || true\n")
                
                # If metadata found, tag each file
                if metadata["found"]:
                    f.write("# Tag ALAC files with metadata\n")
                    for i, track in enumerate(metadata["tracks"], 1):
                        track_num = str(i).zfill(2)
                        safe_title = track["title"].replace("/", "-").replace("\\", "-").replace('"', "'").replace("'", "'\\''")
                        f.write(f"if [ -f track{track_num}.cdda.wav ]; then\n")
                        f.write(f"  # Skip if M4A already exists\n")
                        f.write(f"  if [ -f \"{i:02d} - {safe_title}.m4a\" ]; then\n")
                        f.write(f"    echo '[RIP] Skipping Track {i} - M4A already exists' | tee -a rip.log\n")
                        f.write(f"    rm track{track_num}.cdda.wav\n")
                        f.write(f"  else\n")
                        f.write(f"    echo '[RIP] Converting Track {i}: {safe_title}' | tee -a rip.log\n")
                        f.write(f"    # Use -nostdin to prevent ffmpeg from waiting for input, redirect output directly\n")
                        f.write(f"    if ffmpeg -nostdin -y -i track{track_num}.cdda.wav -acodec alac \\\n")
                        f.write(f"      -metadata artist=\"{metadata['artist']}\" \\\n")
                        f.write(f"      -metadata album=\"{metadata['album']}\" \\\n")
                        f.write(f"      -metadata title=\"{safe_title}\" \\\n")
                        f.write(f"      -metadata track={i}")
                        if metadata["year"]:
                            f.write(f" \\\n      -metadata date={metadata['year']}")
                        f.write(f" \\\n      \"{i:02d} - {safe_title}.m4a\" </dev/null >>rip.log 2>&1; then\n")
                        f.write(f"      rm track{track_num}.cdda.wav\n")
                        f.write(f"      echo '[RIP] Track {i} conversion successful' | tee -a rip.log\n")
                        f.write(f"    else\n")
                        f.write(f"      echo '[ERROR] Track {i} conversion FAILED (exit code $?)' | tee -a rip.log\n")
                        f.write(f"      FAILED_TRACKS=\"$FAILED_TRACKS {i}\"\n")
                        f.write(f"    fi\n")
                        f.write(f"  fi\n")
                        f.write("else\n")
                        f.write(f"  echo '[ERROR] Track {i} WAV file not found: track{track_num}.cdda.wav' | tee -a rip.log\n")
                        f.write(f"  FAILED_TRACKS=\"$FAILED_TRACKS {i}\"\n")
                        f.write("fi\n")
                else:
                    # No metadata - generic conversion
                    f.write("for wav in *.wav; do\n")
                    f.write('  if [ -f "$wav" ]; then\n')
                    f.write('    base=$(basename "$wav" .wav)\n')
                    f.write('    # Skip if M4A already exists\n')
                    f.write('    if [ -f "${base}.m4a" ]; then\n')
                    f.write('      echo "[RIP] Skipping $wav - M4A already exists" | tee -a rip.log\n')
                    f.write('      rm "$wav"\n')
                    f.write('      continue\n')
                    f.write('    fi\n')
                    f.write("    echo \"[RIP] Converting $wav\" | tee -a rip.log\n")
                    f.write('    # Use -nostdin to prevent ffmpeg from waiting for input, redirect output directly\n')
                    f.write('    if ffmpeg -nostdin -y -i "$wav" -acodec alac "${base}.m4a" </dev/null >>rip.log 2>&1; then\n')
                    f.write('      rm "$wav"\n')
                    f.write('      echo "[RIP] $wav conversion successful" | tee -a rip.log\n')
                    f.write('    else\n')
                    f.write('      echo "[ERROR] $wav conversion FAILED (exit code $?)" | tee -a rip.log\n')
                    f.write('      FAILED_TRACKS="$FAILED_TRACKS $base"\n')
                    f.write('    fi\n')
                    f.write("  fi\n")
                    f.write("done\n")
                
                f.write("# Check for failures and set final status\n")
                f.write("if [ -n \"$FAILED_TRACKS\" ]; then\n")
                f.write("  echo \"[RIP] Audio CD rip COMPLETED WITH ERRORS\" | tee -a rip.log\n")
                f.write("  echo \"[ERROR] Failed tracks:$FAILED_TRACKS\" | tee -a rip.log\n")
                f.write("  echo 'COMPLETE_WITH_ERRORS' > status.txt\n")
                f.write("else\n")
                f.write("  echo '[RIP] Audio CD rip complete!' | tee -a rip.log\n")
                f.write("  echo 'COMPLETE' > status.txt\n")
                f.write("fi\n")
            os.chmod(script_path, 0o755)
            
            # Start ripping in background
            print("[RIP] Starting rip script: " + script_path, file=sys.stderr, flush=True)
            subprocess.Popen(["/bin/sh", script_path], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
            
            print("[RIP] Audio CD rip started to " + output_dir, file=sys.stderr, flush=True)
            return jsonify({"ok": True, "output": "Ripping audio CD to " + output_dir + "\\nThis will take several minutes...\\nCheck rip.log in the output folder for progress."})
        
        elif disc_type == "Video DVD":
            # Get format preference from request
            from flask import request
            req_data = request.get_json() or {}
            rip_format = req_data.get('format', 'iso')  # default to iso
            
            # Mount DVD first if not already mounted (with timeout)
            check_mount = subprocess.run(f"mount | grep {OPTICAL}", shell=True, capture_output=True)
            if check_mount.returncode != 0:
                # Not mounted, mount it now
                try:
                    mount_result = subprocess.run(f"mount -t udf,iso9660 -o ro /dev/sr0 {OPTICAL} 2>&1", 
                                                shell=True, capture_output=True, text=True, timeout=10)
                except subprocess.TimeoutExpired:
                    return jsonify({"ok": False, "error": "DVD mount timeout - disc may be damaged"})
                
                if mount_result.returncode != 0:
                    return jsonify({"ok": False, "error": f"Could not mount DVD: {mount_result.stdout}"})
            
            # Get DVD label/name (with timeout)
            label = "DVD"
            try:
                blkid_result = subprocess.run("blkid /dev/sr0 2>&1", shell=True, capture_output=True, text=True, timeout=3)
                if "LABEL=" in blkid_result.stdout:
                    for part in blkid_result.stdout.split():
                        if part.startswith("LABEL="):
                            label = part.split("=", 1)[1].strip('"').replace(" ", "_")
                            break
            except subprocess.TimeoutExpired:
                print("[RIP] blkid timeout, using generic label", file=sys.stderr, flush=True)
            
            timestamp = subprocess.run("date +%Y%m%d_%H%M%S", shell=True, capture_output=True, text=True).stdout.strip()
            
            if rip_format == 'mkv':
                # Rip to MP4/M4V using HandBrakeCLI (Apple-friendly format)
                output_file = f"/raid5/cd-rips/{label}_{timestamp}.m4v"
                log_file = f"/raid5/cd-rips/{label}_{timestamp}.log"
                
                # HandBrakeCLI with Apple 1080p30 preset (H.264 + AAC), ripping main feature
                rip_cmd = f"HandBrakeCLI -i /dev/sr0 -o {output_file} --preset='Apple 1080p60 Surround' --main-feature 2>&1 | tee {log_file}"
                print(f"[RIP] Executing HandBrakeCLI: {rip_cmd}", file=sys.stderr, flush=True)
                
                try:
                    subprocess.Popen(rip_cmd, shell=True)
                except Exception as e:
                    print(f"[RIP] Error starting HandBrakeCLI: {str(e)}", file=sys.stderr, flush=True)
                    return jsonify({"ok": False, "error": f"Failed to start HandBrake rip: {str(e)}"})
                
                print(f"[RIP] Video DVD rip to M4V started: {output_file}", file=sys.stderr, flush=True)
                return jsonify({"ok": True, "output": f"Ripping video DVD to M4V (Apple format):\\n{output_file}\\n\\nThis will take 30-90 minutes depending on length.\\nHandBrake will transcode with H.264 video and AAC audio for Apple devices."})
            
            else:
                # Rip to ISO using dd
                output_file = f"/raid5/cd-rips/{label}_{timestamp}.iso"
                log_file = f"/raid5/cd-rips/{label}_{timestamp}.log"
                
                # Set DVD drive to slower speed to reduce read errors (16x = 22160 KB/s)
                try:
                    subprocess.run("eject -x 16 /dev/sr0", shell=True, timeout=5, capture_output=True)
                    print(f"[RIP] Set drive speed to 16x", file=sys.stderr, flush=True)
                except:
                    pass  # If eject -x fails, continue anyway
                
                # dd command for ISO creation
                rip_cmd = f"dd if=/dev/sr0 of={output_file} bs=2048 conv=noerror,sync 2> {log_file}"
                print(f"[RIP] Executing dd: {rip_cmd}", file=sys.stderr, flush=True)
                
                try:
                    subprocess.Popen(rip_cmd, shell=True)
                except Exception as e:
                    print(f"[RIP] Error starting dd: {str(e)}", file=sys.stderr, flush=True)
                    return jsonify({"ok": False, "error": f"Failed to start ISO rip: {str(e)}"})
                
                print(f"[RIP] Video DVD rip to ISO started: {output_file}", file=sys.stderr, flush=True)
                return jsonify({"ok": True, "output": f"Ripping video DVD to ISO:\\n{output_file}\\n\\nThis will take 10-30 minutes.\\nNote: Encrypted DVDs may fail with I/O errors."})
        
        else:
            return jsonify({"ok": False, "error": f"Ripping not supported for {disc_type}"})
    
    @app.route("/automount/rip/cancel", methods=["POST"])
    def cancel_rip():
        """Cancel an active rip and clean up files"""
        import sys
        from flask import request
        
        req_data = request.get_json() or {}
        rip_name = req_data.get('name', '')
        
        if not rip_name:
            return jsonify({"ok": False, "error": "No rip name provided"})
        
        print(f"[RIP] Cancelling rip: {rip_name}", file=sys.stderr, flush=True)
        
        # Kill any HandBrakeCLI or dd processes related to this rip
        processes_killed = 0
        
        # Try to kill HandBrakeCLI processes
        ps_result = subprocess.run(f"pgrep -f 'HandBrakeCLI.*{rip_name}'", shell=True, capture_output=True, text=True)
        for pid in ps_result.stdout.strip().split('\\n'):
            if pid:
                try:
                    subprocess.run(f"kill -9 {pid}", shell=True, timeout=2)
                    processes_killed += 1
                    print(f"[RIP] Killed HandBrakeCLI process {pid}", file=sys.stderr, flush=True)
                except:
                    pass
        
        # Try to kill dd processes
        ps_result = subprocess.run(f"pgrep -f 'dd if=/dev/sr0.*{rip_name}'", shell=True, capture_output=True, text=True)
        for pid in ps_result.stdout.strip().split('\\n'):
            if pid:
                try:
                    subprocess.run(f"kill -9 {pid}", shell=True, timeout=2)
                    processes_killed += 1
                    print(f"[RIP] Killed dd process {pid}", file=sys.stderr, flush=True)
                except:
                    pass
        
        # Try to kill cdparanoia processes for audio CDs (kill all, they're likely related)
        ps_result = subprocess.run("pgrep -f cdparanoia", shell=True, capture_output=True, text=True)
        for pid in ps_result.stdout.strip().split('\\n'):
            if pid:
                try:
                    subprocess.run(f"kill -9 {pid}", shell=True, timeout=2)
                    processes_killed += 1
                    print(f"[RIP] Killed cdparanoia process {pid}", file=sys.stderr, flush=True)
                except:
                    pass
        
        # Try to kill any ffmpeg processes (for ALAC encoding)
        ps_result = subprocess.run("pgrep -f ffmpeg", shell=True, capture_output=True, text=True)
        for pid in ps_result.stdout.strip().split('\\n'):
            if pid:
                try:
                    subprocess.run(f"kill -9 {pid}", shell=True, timeout=2)
                    processes_killed += 1
                    print(f"[RIP] Killed ffmpeg process {pid}", file=sys.stderr, flush=True)
                except:
                    pass
        
        # Delete incomplete output files
        files_deleted = 0
        base_path = "/raid5/cd-rips"
        
        # Check for various file types
        for ext in ['.m4v', '.mkv', '.iso', '.log']:
            file_path = os.path.join(base_path, rip_name + ext)
            if os.path.exists(file_path):
                try:
                    os.remove(file_path)
                    files_deleted += 1
                    print(f"[RIP] Deleted {file_path}", file=sys.stderr, flush=True)
                except Exception as e:
                    print(f"[RIP] Failed to delete {file_path}: {str(e)}", file=sys.stderr, flush=True)
        
        # Check for audio CD directory
        dir_path = os.path.join(base_path, rip_name)
        if os.path.isdir(dir_path):
            try:
                import shutil
                shutil.rmtree(dir_path)
                files_deleted += 1
                print(f"[RIP] Deleted directory {dir_path}", file=sys.stderr, flush=True)
            except Exception as e:
                print(f"[RIP] Failed to delete {dir_path}: {str(e)}", file=sys.stderr, flush=True)
        
        message = f"Cancelled rip: {rip_name}. "
        if processes_killed > 0:
            message += f"Killed {processes_killed} process(es). "
        if files_deleted > 0:
            message += f"Deleted {files_deleted} file(s)."
        else:
            message += "No files to clean up."
        
        print(f"[RIP] {message}", file=sys.stderr, flush=True)
        return jsonify({"ok": True, "message": message})
    
