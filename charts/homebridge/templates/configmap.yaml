apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homebridge.fullname" . }}-avahi
  labels:
    {{- include "homebridge.labels" . | nindent 4 }}
data:
  avahi-daemon.conf: |
    [server]
    use-ipv4=yes
    use-ipv6=no
    enable-dbus=yes
    allow-interfaces={{ .Values.homebridge.avahi.interface }}
    ratelimit-interval-usec=1000000
    ratelimit-burst=1000

    [wide-area]
    enable-wide-area=yes

    [rlimits]
    rlimit-core=0
    rlimit-data=4194304
    rlimit-fsize=0
    rlimit-nofile=768
    rlimit-stack=4194304
---
{{- if .Values.mosquitto.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homebridge.fullname" . }}-mosquitto
  labels:
    {{- include "homebridge.mosquitto.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    {{- .Values.mosquitto.config | nindent 4 }}
{{- end }}
