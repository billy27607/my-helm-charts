apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homebridge.fullname" . }}
  labels:
    {{- include "homebridge.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "homebridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homebridge.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.homebridge.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: homebridge
          image: "{{ .Values.homebridge.image.repository }}:{{ .Values.homebridge.image.tag }}"
          imagePullPolicy: {{ .Values.homebridge.image.pullPolicy }}
          {{- with .Values.homebridge.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8581
              protocol: TCP
          volumeMounts:
            - name: homebridge-data
              mountPath: /homebridge
            - name: avahi-config
              mountPath: /etc/avahi/avahi-daemon.conf
              subPath: avahi-daemon.conf
            {{- if .Values.homebridge.dri }}
            - name: dri
              mountPath: /dev/dri
            {{- end }}
            {{- if not .Values.zwavejs.enabled }}
            {{- range .Values.homebridge.devices }}
            - name: {{ .name }}
              mountPath: {{ .path }}
            {{- end }}
            {{- end }}
          {{- if or .Values.homebridge.resources .Values.homebridge.intelGpu.enabled }}
          resources:
            {{- if .Values.homebridge.intelGpu.enabled }}
            limits:
              gpu.intel.com/i915: {{ .Values.homebridge.intelGpu.count | quote }}
              {{- with .Values.homebridge.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- else if .Values.homebridge.resources.limits }}
            limits:
              {{- toYaml .Values.homebridge.resources.limits | nindent 14 }}
            {{- end }}
            {{- with .Values.homebridge.resources.requests }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
      volumes:
        - name: homebridge-data
          {{- if .Values.homebridge.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "homebridge.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: avahi-config
          configMap:
            name: {{ include "homebridge.fullname" . }}-avahi
        {{- if .Values.homebridge.dri }}
        - name: dri
          hostPath:
            path: /dev/dri
        {{- end }}
        {{- if not .Values.zwavejs.enabled }}
        {{- range .Values.homebridge.devices }}
        - name: {{ .name }}
          hostPath:
            path: {{ .path }}
            type: CharDevice
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
