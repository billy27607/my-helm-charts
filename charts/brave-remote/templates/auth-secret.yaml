{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brave-remote.fullname" . }}-auth
  labels:
    {{- include "brave-remote.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ required "auth.password is required when auth.enabled is true" .Values.auth.password | quote }}
{{- end }}
