# Network UPS Tools (NUT) for a USB-attached UPS (default: APC Back-UPS Pro BR1500MS2)
#
# Runs, in one pod on the node the UPS's data cable is plugged into:
#   - usbhid-ups driver  (talks to the UPS over USB)
#   - upsd               (NUT network server on :3493 for other equipment)
#   - upsmon (primary)   (waits for LAN clients to shut down, tells the UPS to cut
#                         power after a delay, then powers off this node)
#   - nut_exporter       (Prometheus metrics on :9199/ups_metrics)

image:
  repository: ghcr.io/billy27607/nut-ups
  tag: "1.1.0"
  # IfNotPresent on purpose: after a power outage the node may boot before the
  # internet is back, and the pod must still start from the cached image.
  pullPolicy: IfNotPresent

# Host network so equipment on the LAN can reach upsd at <node-ip>:3493
hostNetwork: true

service:
  enabled: true
  type: ClusterIP
  port: 3493

# UPS driver settings (written to ups.conf)
ups:
  name: ups               # clients monitor "<name>@<node-ip>", e.g. ups@192.168.100.25
  description: "APC Back-UPS Pro BR1500MS2"
  driver: usbhid-ups
  port: auto
  vendorId: "051d"        # APC; set productId too if more than one APC device is attached
  productId: ""
  pollInterval: 15
  # Extra raw lines appended to the [ups] section of ups.conf
  extraConfig: ""

# When to shut down. The UPS's built-in low-battery point (often ~10% / 2 min)
# leaves too little time, so by default the driver ignores it and uses these.
shutdown:
  # Declare "low battery" (triggering shutdown while on battery) at or below either:
  batteryChargeLow: 30      # percent
  batteryRuntimeLow: 300    # seconds of estimated runtime remaining
  # Optionally shut down after this many seconds on battery, regardless of
  # charge (0 = disabled). Cancelled if mains power returns first.
  onBatteryTimeout: 0
  # Seconds the primary waits for LAN clients (NAS, PCs, ...) to disconnect
  # before shutting this node down.
  hostSync: 60
  # After clients are down, tell the UPS to turn its outlets off after
  # offDelay seconds and back on when mains power returns. This makes all
  # equipment boot again once power is back (set BIOS "power on after AC loss").
  killPower: true
  offDelay: 300             # must cover the slowest client (e.g. Synology) and this node powering off
  onDelay: 360              # must be greater than offDelay
  # Command run on the HOST (via nsenter into PID 1's namespaces)
  hostCommand: "systemctl poweroff"
  # true = log what would happen but don't cut UPS power or power off the host
  dryRun: false

# upsd accounts. Leave passwords empty to auto-generate (kept across upgrades).
# Retrieve: kubectl get secret <release>-nut-ups -o jsonpath='{.data.monitor-password}' | base64 -d
auth:
  adminUser: admin
  adminPassword: ""
  # Account for LAN equipment running upsmon as "secondary".
  # Synology DSM hardcodes monuser/secret and UPS name "ups"; set
  # monitorPassword: secret if you want to use a Synology as a client.
  monitorUser: monuser
  monitorPassword: ""
  # Additional raw upsd.users sections, e.g.
  # extraUsers: |
  #   [homeassistant]
  #     password = changeme
  #     upsmon secondary
  extraUsers: ""

# Push notifications. Credentials are stored in the chart Secret and kept
# across upgrades, so they only need to be passed once.
notifications:
  enabled: true
  provider: pushover      # pushover | ntfy
  title: "UPS"            # prefix for notification titles

  # Pushover (https://pushover.net): user key from the dashboard, API token from
  # an application created at https://pushover.net/apps/build
  pushover:
    userKey: ""
    apiToken: ""
    # Emergency priority (battery low, failed self-test) repeats every
    # `retry` seconds until acknowledged or `expire` seconds pass. Enable
    # Critical Alerts in the Pushover iOS app so these sound even when silenced.
    retry: 60
    expire: 1800

  # ntfy (https://ntfy.sh). Leave topic empty to auto-generate an unguessable one.
  ntfy:
    server: https://ntfy.sh
    topic: ""
    token: ""             # access token, only for a self-hosted server with auth

# Monthly quick battery self-test (~10 s on battery), result pushed as a notification.
# A failed test also makes the UPS raise its replace-battery flag.
selfTest:
  enabled: true
  schedule: "0 11 1 * *"  # 11:00 on the 1st of each month
  timeZone: "America/New_York"

# Prometheus exporter sidecar (scraped via prometheus.io/* pod annotations)
exporter:
  enabled: true
  image:
    repository: ghcr.io/druggeri/nut_exporter
    tag: "3.2.5"
    pullPolicy: IfNotPresent
  port: 9199
  vars: "battery.charge,battery.runtime,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,ups.load,ups.realpower.nominal,ups.status"
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

# Required: USB access for the driver, and hostPID + privileged to power off the host
securityContext:
  privileged: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Pin to the node the UPS is plugged into on multi-node clusters, e.g.
# nodeSelector:
#   kubernetes.io/hostname: bsmart
nodeSelector: {}

tolerations: []

affinity: {}
