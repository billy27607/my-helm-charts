{{- $fullname := include "nut-ups.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname -}}
{{- $existingData := dict -}}
{{- if $existing }}{{- $existingData = $existing.data | default dict -}}{{- end -}}
{{- $adminPassword := .Values.auth.adminPassword | default ((get $existingData "admin-password") | b64dec) | default (randAlphaNum 24) -}}
{{- $monitorPassword := .Values.auth.monitorPassword | default ((get $existingData "monitor-password") | b64dec) | default (randAlphaNum 24) -}}
{{- $upsmonPassword := (get $existingData "upsmon-password") | b64dec | default (randAlphaNum 24) -}}
{{- $n := .Values.notifications -}}
{{- $pushoverUser := $n.pushover.userKey | default ((get $existingData "pushover-user") | b64dec) -}}
{{- $pushoverToken := $n.pushover.apiToken | default ((get $existingData "pushover-token") | b64dec) -}}
{{- $ntfyTopic := $n.ntfy.topic | default ((get $existingData "ntfy-topic") | b64dec) | default (printf "ups-%s" (randAlphaNum 24 | lower)) -}}
{{- $s := .Values.shutdown -}}
{{- $u := .Values.ups -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "nut-ups.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ $adminPassword | quote }}
  monitor-password: {{ $monitorPassword | quote }}
  upsmon-password: {{ $upsmonPassword | quote }}
  ntfy-topic: {{ $ntfyTopic | quote }}
  ntfy-token: {{ $n.ntfy.token | quote }}
  pushover-user: {{ $pushoverUser | quote }}
  pushover-token: {{ $pushoverToken | quote }}

  nut.conf: |
    MODE=netserver

  ups.conf: |
    maxretry = 3
    retrydelay = 5

    [{{ $u.name }}]
      driver = {{ $u.driver }}
      port = {{ $u.port }}
      desc = {{ $u.description | quote }}
      {{- with $u.vendorId }}
      vendorid = {{ . }}
      {{- end }}
      {{- with $u.productId }}
      productid = {{ . }}
      {{- end }}
      pollinterval = {{ $u.pollInterval }}
      offdelay = {{ $s.offDelay }}
      ondelay = {{ $s.onDelay }}
      # Ignore the UPS's own low-battery flag; declare LB from these thresholds
      ignorelb
      override.battery.charge.low = {{ $s.batteryChargeLow }}
      override.battery.runtime.low = {{ $s.batteryRuntimeLow }}
      {{- with $u.extraConfig }}
      {{- . | nindent 6 }}
      {{- end }}

  upsd.conf: |
    LISTEN 0.0.0.0 3493
    MAXAGE 25

  upsd.users: |
    [{{ .Values.auth.adminUser }}]
      password = {{ $adminPassword }}
      actions = SET FSD
      instcmds = ALL

    [upsmon]
      password = {{ $upsmonPassword }}
      upsmon primary

    [{{ .Values.auth.monitorUser }}]
      password = {{ $monitorPassword }}
      upsmon secondary
    {{- with .Values.auth.extraUsers }}

    {{- . | nindent 4 }}
    {{- end }}

  upsmon.conf: |
    RUN_AS_USER root
    MONITOR {{ $u.name }}@localhost 1 upsmon {{ $upsmonPassword }} primary
    MINSUPPLIES 1
    SHUTDOWNCMD "/bin/bash /scripts/shutdown.sh"
    NOTIFYCMD /scripts/notify.sh
    POLLFREQ 5
    POLLFREQALERT 5
    HOSTSYNC {{ $s.hostSync }}
    DEADTIME 25
    FINALDELAY 5
    POWERDOWNFLAG /run/nut/killpower
    {{- range list "ONLINE" "ONBATT" "LOWBATT" "FSD" "COMMOK" "COMMBAD" "SHUTDOWN" "REPLBATT" "NOCOMM" }}
    NOTIFYFLAG {{ . }} SYSLOG+EXEC
    {{- end }}

  upssched.conf: |
    CMDSCRIPT /scripts/upssched-cmd.sh
    PIPEFN /run/nut/upssched/upssched.pipe
    LOCKFN /run/nut/upssched/upssched.lock
    {{- if gt (int $s.onBatteryTimeout) 0 }}
    AT ONBATT * START-TIMER onbatt-timeout {{ $s.onBatteryTimeout }}
    AT ONLINE * CANCEL-TIMER onbatt-timeout
    {{- end }}
