image:
  repository: debian
  tag: "12-slim"
  pullPolicy: Always

# Network configuration
# CRITICAL: Must use hostNetwork for mDNS reflection across subnets
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

# Network interfaces to reflect between
# Leave empty to auto-detect, or specify interfaces explicitly
reflector:
  # Enable Avahi daemon for local mDNS reflection
  # Set to false if using the avahi-daemon DaemonSet or another Avahi service
  enableAvahi: false

  # Automatically enable reflection between all network interfaces
  # Auto-detect excludes lo, docker, veth, br-, cni, and flannel interfaces
  # Set to false if you want to manually specify interfaces
  autoDetect: false

  # Manually specify interfaces (only used if autoDetect is false)
interfaces:
  - enp0s25

# Unicast forwarding for cross-site mDNS reflection
# This allows mDNS to work across VPN/WAN connections
unicast:
  # Enable unicast forwarding to remote sites
  enabled: true

  # Listen port for receiving unicast mDNS from remote sites
  port: 5354

  # Remote reflector addresses (IP:port) to forward announcements to
  # IMPORTANT: Set this via --set flag when deploying to each site
  #
  # Main site (bsmart):
  #   --set unicast.peers[0]=192.168.101.25:5354
  #
  # Remote site (fsmart):
  #   --set unicast.peers[0]=192.168.100.25:5354
  #
  peers:
    - 192.168.101.25:5354
  #  - 192.168.100.25:5354

  # Time to live for forwarded announcements (seconds)
  ttl: 3600

# Service filtering - only reflect these service types
# This prevents conflicts with UniFi devices and other mDNS noise
allowedServices:
  # File sharing
  - _smb._tcp              # SMB/CIFS file shares
  - _afpovertcp._tcp       # AFP file shares
  - _nfs._tcp              # NFS shares
  - _ftp._tcp              # FTP servers
  
  # Printers
  - _printer._tcp          # Generic printers
  - _ipp._tcp              # Internet Printing Protocol
  - _ipps._tcp             # IPP over SSL
  - _pdl-datastream._tcp   # Print data stream
  - _scanner._tcp          # Network scanners

  # Time Machine
  - _adisk._tcp            # Apple Disk (Time Machine)
  - _timemachine._tcp      # Time Machine

  # Custom services (add your own)
  - _http._tcp             # HTTP servers
  - _https._tcp            # HTTPS servers
  - _ssh._tcp              # SSH servers
  - _enphase-envoy._tcp        # Enphase Envoy solar inverters
  - _arduino._tcp            # Arduino devices
  - _octoprint._tcp           # OctoPrint 3D printer server
  - _vhusb._tcp              # VHUSB devices (virtual USB over IP)
  
# Services to explicitly block (even if in allowedServices)
# Useful for blocking specific device types
blockedServices:
  - _hap._tcp              # HomeKit Accessory Protocol (can cause conflicts)
  - _airplay._tcp          # AirPlay (should stay local)
  - _raop._tcp             # Remote Audio Output Protocol (AirPlay)
  - _airkan._tcp           # UniFi Airkan
  - _ubnt._tcp             # UniFi devices
  - _ubnt-discover._tcp    # UniFi discovery
  - _spotify-connect._tcp  # Spotify Connect (can cause issues)
  - _googlecast._tcp       # Chromecast (can cause issues)

# Avahi daemon configuration
avahi:
  # Domain name for local network
  domainName: local
  
  # Enable/disable IPv6
  useIPv6: false
  
  # Allow interfaces to be specified in config
  allowInterfaces: ""
  
  # Deny interfaces (comma-separated)
  denyInterfaces: "lo"
  
  # Publish workstation
  publishWorkstation: true
  
  # Enable reflector (must be true)
  enableReflector: true
  
  # Reflect only if TTL > 0 (prevents loops)
  reflectIPv: true

# Resource limits
resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Security context - needs NET_ADMIN for mDNS
securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW

# Node selector (deploy to specific nodes if needed)
nodeSelector: {}

tolerations: []

affinity: {}
