# OctoPrint - Main 3D printer interface
octoprint:
  enabled: true
  image:
    repository: octoprint/octoprint
    tag: "latest"
    pullPolicy: Always

  # Network configuration
  hostNetwork: true
  service:
    type: ClusterIP
    port: 80
    targetPort: 5000

  # Serial port for 3D printer communication
  # Specify the device path on your node (e.g., /dev/ttyUSB0, /dev/ttyACM0)
  serialPort: /dev/ttyACM0

  # Security context (required for serial device access)
  securityContext:
    privileged: true

  # Persistent storage for OctoPrint data
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""  # Leave empty for default StorageClass
    accessMode: ReadWriteOnce

  # Webcam configuration (using go2rtc for streaming, proxied through nginx)
  webcam:
    streamUrl: "http://localhost:8080/webcam/?action=stream"
    snapshotUrl: "http://localhost:8080/webcam/?action=snapshot"

  # Environment variables
  env:
    extra:
    - name: OCTOPRINT_PORT
      value: "5000"

  # Resource limits
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Node selection
  nodeSelector: {}
  affinity: {}
  tolerations: []

  # Ingress configuration
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/proxy-body-size: "0"
    hosts:
      - host: octoprint.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: octoprint-tls
    #    hosts:
    #      - octoprint.local

# go2rtc - WebRTC/HLS webcam streaming
mjpgStreamer:
  enabled: true
  image:
    repository: ghcr.io/alexxit/go2rtc
    tag: latest
    pullPolicy: Always

  # Network configuration
  hostNetwork: true

  # Video device for camera
  device: /dev/video0

  # Privileged mode required for device access
  privileged: true

  # Camera settings
  resolution: "640x480"
  fps: 15
  # V4L2 input format - common values: mjpeg, yuyv422, h264
  # Use 'v4l2-ctl --list-formats-ext' on the node to see what your camera supports
  inputFormat: mjpeg

  service:
    type: ClusterIP
    apiPort: 1984

  # WebRTC ICE host IPs - set to your node's LAN IP to fix WebRTC on Kubernetes
  # (prevents go2rtc from advertising unreachable cluster-internal IPs as ICE candidates)
  # Example: ["192.168.1.100"]
  webrtcICEHostIPs: ["192.168.100.24"]

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []

# Common settings
nameOverride: ""
fullnameOverride: ""
