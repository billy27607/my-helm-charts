{{- if .Values.mjpgStreamer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "octoprint.fullname" . }}-mjpg-streamer
  labels:
    {{- include "octoprint.mjpgStreamer.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "octoprint.mjpgStreamer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octoprint.mjpgStreamer.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/mediamtx-config.yaml") . | sha256sum }}
    spec:
      {{- if .Values.mjpgStreamer.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: go2rtc
          image: "{{ .Values.mjpgStreamer.image.repository }}:{{ .Values.mjpgStreamer.image.tag }}"
          imagePullPolicy: {{ .Values.mjpgStreamer.image.pullPolicy }}
          {{- if .Values.mjpgStreamer.privileged }}
          securityContext:
            privileged: true
          {{- end }}
          ports:
            - name: api
              containerPort: 1984
              protocol: TCP
            - name: webrtc-media
              containerPort: 8555
              protocol: TCP
          volumeMounts:
            - name: go2rtc-config
              mountPath: /config/go2rtc.yaml
              subPath: go2rtc.yaml
          {{- with .Values.mjpgStreamer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: camera
          image: "{{ .Values.mjpgStreamer.image.repository }}:{{ .Values.mjpgStreamer.image.tag }}"
          imagePullPolicy: {{ .Values.mjpgStreamer.image.pullPolicy }}
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - "while true; do ffmpeg -f v4l2 -input_format {{ .Values.mjpgStreamer.inputFormat }} -video_size {{ .Values.mjpgStreamer.resolution }} -framerate {{ .Values.mjpgStreamer.fps }} -i {{ .Values.mjpgStreamer.device }} -c:v copy -rtsp_transport tcp -f rtsp rtsp://127.0.0.1:8554/stream || true; sleep 2; done"
          volumeMounts:
            - name: dev-video
              mountPath: {{ .Values.mjpgStreamer.device }}
      volumes:
        - name: go2rtc-config
          configMap:
            name: {{ include "octoprint.fullname" . }}-go2rtc
        - name: dev-video
          hostPath:
            path: {{ .Values.mjpgStreamer.device }}
      {{- with .Values.mjpgStreamer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mjpgStreamer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
