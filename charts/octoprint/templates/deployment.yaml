{{- if .Values.octoprint.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "octoprint.fullname" . }}
  labels:
    {{- include "octoprint.octoprint.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "octoprint.octoprint.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octoprint.octoprint.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.octoprint.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.octoprint.securityContext.privileged }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      containers:
      - name: octoprint
        image: "{{ .Values.octoprint.image.repository }}:{{ .Values.octoprint.image.tag }}"
        imagePullPolicy: {{ .Values.octoprint.image.pullPolicy }}
        {{- if not .Values.octoprint.hostNetwork }}
        ports:
        - name: http
          containerPort: {{ .Values.octoprint.service.targetPort }}
          protocol: TCP
        {{- end }}
        env:
        {{- range .Values.octoprint.env.extra }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        - name: OCTOPRINT_WEBCAM_STREAM
          value: {{ .Values.octoprint.webcam.streamUrl | quote }}
        - name: OCTOPRINT_WEBCAM_SNAPSHOT
          value: {{ .Values.octoprint.webcam.snapshotUrl | quote }}
        volumeMounts:
        - name: data
          mountPath: /octoprint
        - name: serial
          mountPath: {{ .Values.octoprint.serialPort }}
        - name: webcam-config
          mountPath: /octoprint/octoprint/config.d/webcam.yaml
          subPath: webcam.yaml
        {{- if .Values.octoprint.securityContext.privileged }}
        securityContext:
          privileged: true
        {{- end }}
        resources:
          {{- toYaml .Values.octoprint.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.octoprint.service.targetPort }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.octoprint.service.targetPort }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      - name: webcam-proxy
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: webcam
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
      volumes:
      - name: data
        {{- if .Values.octoprint.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "octoprint.fullname" . }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: serial
        hostPath:
          path: {{ .Values.octoprint.serialPort }}
      - name: webcam-config
        configMap:
          name: {{ include "octoprint.fullname" . }}-webcam-config
      - name: nginx-config
        configMap:
          name: {{ include "octoprint.fullname" . }}-nginx-config
      {{- with .Values.octoprint.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.octoprint.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.octoprint.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
