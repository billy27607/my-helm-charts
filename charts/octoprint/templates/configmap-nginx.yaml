{{- if .Values.octoprint.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "octoprint.fullname" . }}-nginx-config
  labels:
    {{- include "octoprint.octoprint.labels" . | nindent 4 }}
data:
  default.conf: |
    map $arg_action $target_url {
        stream  "http://127.0.0.1:1984/api/stream.mjpeg?src=stream";
        snapshot "http://127.0.0.1:1984/api/frame.jpeg?src=stream";
        default "";
    }

    server {
        listen 8080;
        server_name _;

        location /webcam/ {
            if ($target_url = "") {
                return 404;
            }
            
            proxy_pass $target_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }
    }
{{- end }}
